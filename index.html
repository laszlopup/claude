<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Test</title>
<style>
  :root {
    --bg: #0b1020;
    --fg: #e8ecf8;
    --accent: #7c9cff;
    --muted: #8a93b3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% 0%, #1a2350 0%, var(--bg) 60%) fixed;
    color: var(--fg);
    display: grid;
    place-items: center;
    padding: 2rem;
  }
  main {
    max-width: 640px;
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 2.5rem;
    backdrop-filter: blur(8px);
  }
  h1 {
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }
  .accent { color: var(--accent); }
  p { color: var(--muted); line-height: 1.6; margin-bottom: 1rem; }
  .meta {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 0.9rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .meta code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(255,255,255,0.06);
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    color: var(--fg);
  }
  .pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #43e07a;
    margin-right: 0.5rem;
    box-shadow: 0 0 0 0 rgba(67, 224, 122, 0.7);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(67, 224, 122, 0.6); }
    70% { box-shadow: 0 0 0 12px rgba(67, 224, 122, 0); }
    100% { box-shadow: 0 0 0 0 rgba(67, 224, 122, 0); }
  }
</style>
</head>
<body>
<main>
  <h1>Hello from <span class="accent">Claude</span></h1>
  <p><span class="pulse"></span>Deployment test page — if you can see this, the pipeline works.</p>
  <p>This is a static HTML page with no dependencies, pushed to the deploy branch to verify the platform end-to-end.</p>
  <div class="meta">
    <div>Branch: <code>claude/deploy-test-website-NrjjS</code></div>
    <div>Built: <code id="built"></code></div>
  </div>
</main>
<script>
  document.getElementById('built').textContent = new Date().toISOString();
</script>
</body>
</html>
